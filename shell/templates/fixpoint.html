<!--
  shell/templates/fixpoint.html — the route template for '/fixpoint-linux'.

  The [data-mfe="fixpoint-landing"] element is the slot the shell's reconcile
  mounts the (cross-origin, via import map) fixpointlinux.org Elm MFE into.
  This route is client-only: it is not pre-rendered by ssg.mjs, and is loaded
  on-demand when the user navigates to /dafsa/fixpoint-linux. ssg.mjs copies
  the whole shell/ directory into dist/, so this template ships automatically.
-->
<div class="fixpoint-root">
  <div data-mfe="fixpoint-landing"></div>
</div>
